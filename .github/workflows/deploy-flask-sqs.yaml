name: Deploy SQS Service to Amazon ECS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ysim
    paths:
      - 'flask-sqs-service/**'
      - 'terraform/**'
      - '.github/workflows/deploy-flask-sqs.yaml'

jobs:
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Get AWS Account ID
      id: account-id
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: Terraform Apply
      working-directory: ./terraform
      run: |
        terraform apply -auto-approve \
          -var="s3_service_image=${{ steps.account-id.outputs.account_id }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/${{ vars.S3_ECR_REPOSITORY || 's3-service' }}:latest" \
          -var="sqs_service_image=${{ steps.account-id.outputs.account_id }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }}:latest"

  deploy:
    name: Deploy SQS Service
    runs-on: ubuntu-latest
    environment: dev
    needs: terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Create ECR repository if it doesn't exist
      run: |
        aws ecr describe-repositories --repository-names ${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }} || \
        aws ecr create-repository --repository-name ${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Docker image to Amazon ECR
      uses: docker/build-push-action@v4
      with:
        context: ./flask-sqs-service
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }}:latest
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Download task definition
      id: download-task-def
      continue-on-error: true
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ vars.SQS_TASK_DEF || 'ecs-multi-service-sqs-service' }} \
          --query taskDefinition > task-definition.json

    - name: Create initial task definition if it doesn't exist
      if: steps.download-task-def.outcome == 'failure'
      run: |
        AWS_ACCOUNT_ID=$(echo "${{ steps.login-ecr.outputs.registry }}" | cut -d'.' -f1)
        cat > task-definition.json <<EOF
        {
          "family": "${{ vars.SQS_TASK_DEF || 'ecs-multi-service-sqs-service' }}",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "256",
          "memory": "512",
          "executionRoleArn": "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecs-multi-service-ecs-task-execution-role",
          "taskRoleArn": "arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecs-multi-service-ecs-task-role",
          "containerDefinitions": [
            {
              "name": "${{ vars.SQS_CONTAINER_NAME || 'sqs-app' }}",
              "image": "${{ steps.login-ecr.outputs.registry }}/${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }}:${{ github.sha }}",
              "essential": true,
              "portMappings": [
                {
                  "containerPort": 5002,
                  "protocol": "tcp"
                }
              ],
              "environment": [
                {
                  "name": "AWS_REGION",
                  "value": "${{ vars.AWS_REGION || 'us-east-1' }}"
                }
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/ecs-multi-service/sqs-service",
                  "awslogs-region": "${{ vars.AWS_REGION || 'us-east-1' }}",
                  "awslogs-stream-prefix": "ecs"
                }
              }
            }
          ]
        }
        EOF

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ vars.SQS_CONTAINER_NAME || 'sqs-app' }}
        image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.SQS_ECR_REPOSITORY || 'sqs-service' }}:${{ github.sha }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ vars.SQS_ECS_SERVICE || 'sqs-service' }}
        cluster: ${{ vars.ECS_CLUSTER || 'ecs-multi-service-cluster' }}
        wait-for-service-stability: true
      continue-on-error: true
      id: deploy

    - name: Check deployment status
      if: steps.deploy.outcome == 'failure'
      run: |
        echo "::warning::ECS deployment failed. This might be because:"
        echo "::warning::1. The ECS cluster doesn't exist yet - run Terraform first"
        echo "::warning::2. The ECS service doesn't exist - run Terraform first"
        echo "::warning::3. IAM roles are missing - ensure Terraform has been applied"
        echo ""
        echo "To fix this, run the following commands:"
        echo "  cd terraform"
        echo "  terraform init"
        echo "  terraform apply"
        exit 1
